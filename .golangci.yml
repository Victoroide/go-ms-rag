version: "2"
run:
  timeout: 5m
  go: "1.27.3"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
    - bodyclose
    - errorlint
    - gosec
    - revive
    - noctx
    - contextcheck
    - nilerr
    - unconvert
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - style
    misspell:
      locale: US
  exclusions:
    presets: []
formatters:
  enable:
    - gofmt
    - goimports
